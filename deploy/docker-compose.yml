services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: roxycloud
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: roxycloud
    volumes:
      - db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roxycloud"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://roxycloud:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db/roxycloud
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      BLOB_ROOT: /var/lib/roxycloud
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - blobs:/var/lib/roxycloud
    ports:
      - "3001:3001"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

volumes:
  db:
  blobs:
