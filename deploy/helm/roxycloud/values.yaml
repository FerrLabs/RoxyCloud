image:
  repository: ghcr.io/ferrlabs/roxycloud-api
  # Defaults to the chart's appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# The chart does not run Postgres. Point it at one you already have, either
# inline or through a secret you manage.
database:
  url: ""
  existingSecret: ""
  existingSecretKey: database-url

# HS256 secret for session tokens. Rotating it signs every session out.
jwt:
  secret: ""
  existingSecret: ""
  existingSecretKey: jwt-secret

# Creates the first administrator on an empty database, then does nothing.
bootstrapAdmin:
  email: ""
  password: ""

config:
  corsAllowedOrigins: []
  defaultQuotaBytes: ""
  sessionTtlSeconds: ""
  blobSweepIntervalSeconds: ""
  blobGracePeriodSeconds: ""

# Where the bytes live. On local disk one replica owns the directory, so the
# chart refuses a second one; an object store has no such constraint and is what
# makes replicaCount worth setting.
blobs:
  backend: local
  s3:
    bucket: ""
    # Leave empty for AWS. MinIO and Garage want their own URL here.
    endpoint: ""
    region: us-east-1
    prefix: ""
    # Omit both to use whatever credentials the pod already has, which is how a
    # role attached to the service account works.
    accessKeyId: ""
    secretAccessKey: ""
    existingSecret: ""
    accessKeyIdKey: s3-access-key-id
    secretAccessKeyKey: s3-secret-access-key

replicaCount: 1

# Only read when blobs.backend is local.
persistence:
  enabled: true
  existingClaim: ""
  storageClass: ""
  accessMode: ReadWriteOnce
  size: 20Gi
  # Keeps the claim when the release is uninstalled, so the blobs outlive a
  # mistake. Reinstalling then means pointing existingClaim at what was kept.
  retain: true

service:
  type: ClusterIP
  port: 3001

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls:
    enabled: false
    secretName: ""

resources: {}

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
