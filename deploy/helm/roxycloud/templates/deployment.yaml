apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "roxycloud.fullname" . }}
  labels:
    {{- include "roxycloud.labels" . | nindent 4 }}
{{- $local := eq .Values.blobs.backend "local" }}
{{- if and $local (gt (int .Values.replicaCount) 1) }}
{{- fail "blobs.backend=local puts the blobs in one pod's volume, so a second replica would serve half the files; set blobs.backend=s3 to run more than one" }}
{{- end }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- if $local }}
    # One volume, one writer: the old pod has to let go before the new one starts.
    type: Recreate
    {{- else }}
    type: RollingUpdate
    {{- end }}
  selector:
    matchLabels:
      {{- include "roxycloud.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "roxycloud.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
              protocol: TCP
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            {{- if $local }}
            - name: BLOB_ROOT
              value: /var/lib/roxycloud
            {{- else }}
            - name: BLOB_BACKEND
              value: s3
            - name: S3_BUCKET
              value: {{ required "set blobs.s3.bucket when blobs.backend is s3" .Values.blobs.s3.bucket | quote }}
            {{- with .Values.blobs.s3.endpoint }}
            - name: S3_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.blobs.s3.region }}
            - name: S3_REGION
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.blobs.s3.prefix }}
            - name: S3_PREFIX
              value: {{ . | quote }}
            {{- end }}
            {{- if or .Values.blobs.s3.existingSecret .Values.blobs.s3.accessKeyId }}
            - name: S3_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ include "roxycloud.s3Secret" . }}
                  key: {{ .Values.blobs.s3.accessKeyIdKey }}
            - name: S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "roxycloud.s3Secret" . }}
                  key: {{ .Values.blobs.s3.secretAccessKeyKey }}
            {{- end }}
            {{- end }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "roxycloud.databaseSecret" . }}
                  key: {{ .Values.database.existingSecretKey }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "roxycloud.jwtSecret" . }}
                  key: {{ .Values.jwt.existingSecretKey }}
            {{- with .Values.config.corsAllowedOrigins }}
            - name: CORS_ALLOWED_ORIGINS
              value: {{ join "," . | quote }}
            {{- end }}
            {{- if ne (toString .Values.config.defaultQuotaBytes) "" }}
            - name: DEFAULT_QUOTA_BYTES
              value: {{ .Values.config.defaultQuotaBytes | quote }}
            {{- end }}
            {{- if ne (toString .Values.config.sessionTtlSeconds) "" }}
            - name: SESSION_TTL_SECONDS
              value: {{ .Values.config.sessionTtlSeconds | quote }}
            {{- end }}
            {{- if ne (toString .Values.config.blobSweepIntervalSeconds) "" }}
            - name: BLOB_SWEEP_INTERVAL_SECONDS
              value: {{ .Values.config.blobSweepIntervalSeconds | quote }}
            {{- end }}
            {{- if ne (toString .Values.config.blobGracePeriodSeconds) "" }}
            - name: BLOB_GRACE_PERIOD_SECONDS
              value: {{ .Values.config.blobGracePeriodSeconds | quote }}
            {{- end }}
            {{- if .Values.bootstrapAdmin.email }}
            {{- if not .Values.bootstrapAdmin.password }}
            {{- fail "set bootstrapAdmin.password when bootstrapAdmin.email is set" }}
            {{- end }}
            - name: BOOTSTRAP_ADMIN_EMAIL
              value: {{ .Values.bootstrapAdmin.email | quote }}
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "roxycloud.fullname" . }}
                  key: bootstrap-admin-password
            {{- end }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 3
            failureThreshold: 40
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if $local }}
          volumeMounts:
            - name: blobs
              mountPath: /var/lib/roxycloud
          {{- end }}
      {{- if $local }}
      volumes:
        - name: blobs
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "roxycloud.claimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
