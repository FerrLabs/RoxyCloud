{{- $ownsDatabase := not .Values.database.existingSecret }}
{{- $ownsJwt := not .Values.jwt.existingSecret }}
{{- $ownsS3 := and (eq .Values.blobs.backend "s3") (not .Values.blobs.s3.existingSecret) .Values.blobs.s3.accessKeyId }}
{{- if or $ownsDatabase $ownsJwt $ownsS3 .Values.bootstrapAdmin.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "roxycloud.fullname" . }}
  labels:
    {{- include "roxycloud.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $ownsDatabase }}
  {{- if not .Values.database.url }}
  {{- fail "set database.url, or database.existingSecret to point at a secret you manage" }}
  {{- end }}
  {{ .Values.database.existingSecretKey }}: {{ .Values.database.url | quote }}
  {{- end }}
  {{- if $ownsJwt }}
  {{- if not .Values.jwt.secret }}
  {{- fail "set jwt.secret, or jwt.existingSecret to point at a secret you manage" }}
  {{- end }}
  {{ .Values.jwt.existingSecretKey }}: {{ .Values.jwt.secret | quote }}
  {{- end }}
  {{- if $ownsS3 }}
  {{- if not .Values.blobs.s3.secretAccessKey }}
  {{- fail "set blobs.s3.secretAccessKey alongside blobs.s3.accessKeyId, or blobs.s3.existingSecret to point at a secret you manage" }}
  {{- end }}
  {{ .Values.blobs.s3.accessKeyIdKey }}: {{ .Values.blobs.s3.accessKeyId | quote }}
  {{ .Values.blobs.s3.secretAccessKeyKey }}: {{ .Values.blobs.s3.secretAccessKey | quote }}
  {{- end }}
  {{- if .Values.bootstrapAdmin.password }}
  bootstrap-admin-password: {{ .Values.bootstrapAdmin.password | quote }}
  {{- end }}
{{- end }}
