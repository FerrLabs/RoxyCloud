{{- $ownsDatabase := not .Values.database.existingSecret }}
{{- $ownsJwt := not .Values.jwt.existingSecret }}
{{- if or $ownsDatabase $ownsJwt .Values.bootstrapAdmin.password }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "roxycloud.fullname" . }}
  labels:
    {{- include "roxycloud.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if $ownsDatabase }}
  {{- if not .Values.database.url }}
  {{- fail "set database.url, or database.existingSecret to point at a secret you manage" }}
  {{- end }}
  {{ .Values.database.existingSecretKey }}: {{ .Values.database.url | quote }}
  {{- end }}
  {{- if $ownsJwt }}
  {{- if not .Values.jwt.secret }}
  {{- fail "set jwt.secret, or jwt.existingSecret to point at a secret you manage" }}
  {{- end }}
  {{ .Values.jwt.existingSecretKey }}: {{ .Values.jwt.secret | quote }}
  {{- end }}
  {{- if .Values.bootstrapAdmin.password }}
  bootstrap-admin-password: {{ .Values.bootstrapAdmin.password | quote }}
  {{- end }}
{{- end }}
