<nav aria-label="Folder path">
  <ol>
    <li>
      @if (segments().length === 0) {
        <span aria-current="page">All files</span>
      } @else {
        <a routerLink="/">All files</a>
      }
    </li>
    @for (segment of segments(); track segment.path; let last = $last) {
      <li>
        @if (last) {
          <span aria-current="page">{{ segment.name }}</span>
        } @else {
          <a [routerLink]="'/' + segment.path">{{ segment.name }}</a>
        }
      </li>
    }
  </ol>
</nav>
