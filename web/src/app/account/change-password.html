<dialog #dialog (cancel)="dismiss()">
  <form method="dialog" (submit)="$event.preventDefault(); submit()">
    <h2>Change your password</h2>

    <label>
      Current password
      <input
        type="password"
        autocomplete="current-password"
        required
        [value]="current()"
        (input)="current.set($any($event.target).value)"
      />
    </label>

    <label>
      New password
      <input
        type="password"
        autocomplete="new-password"
        required
        minlength="12"
        [value]="replacement()"
        (input)="replacement.set($any($event.target).value)"
      />
    </label>
    <p class="hint">At least twelve characters. Your sessions elsewhere are not signed out.</p>

    @if (failure(); as message) {
      <p class="failure" role="alert">{{ message }}</p>
    }

    <div class="actions">
      <button type="button" class="ghost" (click)="dismiss()">Cancel</button>
      <button
        type="submit"
        class="primary"
        [disabled]="busy() || current().length === 0 || replacement().length === 0"
      >
        {{ busy() ? 'Changing' : 'Change password' }}
      </button>
    </div>
  </form>
</dialog>
