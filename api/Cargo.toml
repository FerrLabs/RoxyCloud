[package]
name = "roxycloud-api"
version.workspace = true
description = "Self-hosted file storage with WebDAV, over a content-addressed blob store"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
roxycloud-core = { workspace = true, features = ["postgres"] }

axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.7", features = ["cors", "fs", "trace"] }

tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }

sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "uuid",
    "migrate",
] }

serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
blake3 = { workspace = true }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
argon2 = { workspace = true }
getrandom = "0.4"
percent-encoding = { workspace = true }
quick-xml = "0.41"

[dev-dependencies]
tempfile = "3"
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
