[package]
name = "roxycloud-api"
version.workspace = true
description = "Self-hosted file storage with WebDAV, over a content-addressed blob store"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
roxycloud-core = { workspace = true, features = ["postgres"] }

axum = { version = "0.8", features = ["macros"] }
tower-http = { version = "0.7", features = ["cors", "fs", "trace"] }

tokio = { workspace = true }
tokio-util = { workspace = true }
futures = { workspace = true }
bytes = { workspace = true }

sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "chrono",
    "uuid",
    "migrate",
] }

serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
uuid = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
blake3 = { workspace = true }
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
argon2 = { workspace = true }
getrandom = "0.4"
percent-encoding = { workspace = true }
quick-xml = "0.41"
async-trait = "0.1"
reqwest = { workspace = true }
base64 = "0.22"
sha2 = "0.10"

# Pure Rust decoders on purpose: the classic remote-code-execution surface in this area is a C
# image library, and the default features here pull none.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

aws-config = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
aws-sdk-s3 = { version = "1", default-features = false, features = ["behavior-version-latest", "rt-tokio", "rustls"] }
aws-smithy-types = { version = "1", features = ["rt-tokio"] }
aws-credential-types = "1"

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
image = { version = "0.25", default-features = false, features = ["png"] }
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
