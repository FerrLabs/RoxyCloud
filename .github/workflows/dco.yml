name: DCO

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Every commit needs a Signed-off-by line
        run: |
          missing=$(git log --format='%H %s' --invert-grep --grep='^Signed-off-by: ' \
            "origin/${{ github.base_ref }}..HEAD")
          if [ -n "$missing" ]; then
            echo "Commits without a sign-off:"
            echo "$missing"
            echo "Run: git rebase --signoff origin/${{ github.base_ref }}"
            exit 1
          fi
