name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without committing, tagging or publishing a release'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The postBump hook runs cargo update to keep Cargo.lock in step
        uses: dtolnay/rust-toolchain@stable

      - uses: FerrLabs/FerrFlow@v7
        with:
          bot: true
          dry_run: ${{ inputs.dry_run || false }}
