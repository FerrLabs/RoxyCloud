name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Run without committing, tagging or publishing a release'
        type: boolean
        default: false

permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(release):')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: The postBump hook runs cargo update to keep Cargo.lock in step
        uses: dtolnay/rust-toolchain@stable

      - uses: FerrLabs/FerrFlow@v7
        with:
          bot: true
          dry_run: ${{ inputs.dry_run || false }}

  released:
    needs: release
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: A tag on the release commit is what says a release happened
        id: tag
        run: |
          version=$(git tag --points-at HEAD | sed -n 's/^v//p' | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -z "$version" ]; then
            echo "Nothing was tagged in this run, so there is no image to build." >> "$GITHUB_STEP_SUMMARY"
          fi

  image:
    needs: released
    if: needs.released.outputs.version != ''
    uses: ./.github/workflows/image.yml
    permissions:
      contents: read
      packages: write
    with:
      version: ${{ needs.released.outputs.version }}
      push: true
