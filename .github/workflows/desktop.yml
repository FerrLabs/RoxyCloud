name: Desktop

# A release used to carry the API image and nothing a person could install, so
# the desktop app existed only for whoever cloned the repository and built it.
# This attaches the installers to the release instead.
#
# Kept out of ci.yml on purpose: a Tauri bundle takes minutes and only means
# something once a version is published.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build, for example v0.26.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: target/release/bundle/nsis/*.exe
            extra: --bundles nsis
          - os: ubuntu-latest
            bundles: target/release/bundle/appimage/*.AppImage
            extra: --bundles appimage
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The published tag, not the head of main: main can move between the
          # release and this job, and the installer would then carry a version
          # number that matches nothing.
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false

      - name: Tauri needs a webview and a tray at build time
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libgtk-3-dev patchelf file

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Bundle
        working-directory: app
        run: pnpm exec tauri build ${{ matrix.extra }}

      # target/ is at the root of the repository, not under app/: every crate in
      # the workspace shares one output directory.
      - name: Attach the installer to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          bundles=(${{ matrix.bundles }})
          if [ ${#bundles[@]} -eq 0 ]; then
            echo "the bundle produced no installer" >&2
            ls -R target/release/bundle >&2 || true
            exit 1
          fi

          printf 'uploading %s\n' "${bundles[@]}"
          gh release upload "$TAG" "${bundles[@]}" --clobber --repo "$GITHUB_REPOSITORY"
