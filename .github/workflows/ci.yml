name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: roxy
          POSTGRES_PASSWORD: roxy
          POSTGRES_DB: roxycloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roxy"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@v5

      - name: Tauri needs a webview and a tray at build time
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: The desktop build embeds web/dist, so it comes first
        run: pnpm run build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The suites under api/tests create a database each and skip themselves
      # when DATABASE_URL is unset, which is what keeps `cargo test` working on
      # a machine with no Postgres.
      - run: cargo test --workspace --locked
        env:
          DATABASE_URL: postgres://roxy:roxy@localhost:5432/roxycloud

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: azure/setup-helm@v4
      - name: A chart that does not render is worse than no chart
        run: |
          helm lint deploy/helm/roxycloud --set database.url=x --set jwt.secret=y
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz             | tar -xz -C /usr/local/bin kubeconform
          helm template roxycloud deploy/helm/roxycloud             --set database.url=postgres://u:p@db/roxycloud             --set jwt.secret=secret             --set ingress.enabled=true             --set ingress.host=roxycloud.example             --set ingress.tls.enabled=true             --set ingress.tls.secretName=roxycloud-tls             | kubeconform -strict -summary

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Self-host path must stay working
        run: |
          export POSTGRES_PASSWORD=ci JWT_SECRET=ci-secret
          docker compose -f deploy/docker-compose.yml up -d --build --wait
          curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://localhost:3001/health
          docker compose -f deploy/docker-compose.yml down -v
