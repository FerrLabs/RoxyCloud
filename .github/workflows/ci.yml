name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: roxy
          POSTGRES_PASSWORD: roxy
          POSTGRES_DB: roxycloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roxy"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: An object store, so the S3 backend is exercised rather than assumed
        run: |
          docker run -d --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin minio/minio:latest server /data
          for _ in $(seq 1 30); do
            curl -fsS http://localhost:9000/minio/health/live > /dev/null && exit 0
            sleep 1
          done
          echo "MinIO never came up" >&2
          exit 1

      - name: Tauri needs a webview and a tray at build time
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: The desktop build embeds web/dist, so it comes first
        run: pnpm run build

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The suites under api/tests create a database each and skip themselves
      # when DATABASE_URL is unset, which is what keeps `cargo test` working on
      # a machine with no Postgres.
      - run: cargo test --workspace --locked
        env:
          DATABASE_URL: postgres://roxy:roxy@localhost:5432/roxycloud
          S3_TEST_ENDPOINT: http://localhost:9000

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
      - name: A chart that does not render is worse than no chart
        run: |
          helm lint deploy/helm/roxycloud --set database.url=x --set jwt.secret=y
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz             | tar -xz -C /usr/local/bin kubeconform
          helm template roxycloud deploy/helm/roxycloud             --set database.url=postgres://u:p@db/roxycloud             --set jwt.secret=secret             --set ingress.enabled=true             --set ingress.host=roxycloud.example             --set ingress.tls.enabled=true             --set ingress.tls.secretName=roxycloud-tls             | kubeconform -strict -summary
          helm template roxycloud deploy/helm/roxycloud             --set database.existingSecret=roxycloud-database             --set jwt.existingSecret=roxycloud-jwt             --set persistence.enabled=false             --set config.blobSweepIntervalSeconds=0             | kubeconform -strict -summary
          helm template roxycloud deploy/helm/roxycloud             --set database.url=postgres://u:p@db/roxycloud             --set jwt.secret=secret             --set blobs.backend=s3             --set blobs.s3.bucket=roxycloud             --set blobs.s3.existingSecret=roxycloud-s3             --set replicaCount=3             | kubeconform -strict -summary

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Self-host path must stay working
        run: |
          export POSTGRES_PASSWORD=ci JWT_SECRET=ci-secret
          docker compose -f deploy/docker-compose.yml up -d --build --wait
          curl --fail --retry 10 --retry-delay 3 --retry-connrefused http://localhost:3001/health
          curl --fail --silent http://localhost:3001/ | grep -q '<rx-root>'
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:3001/v1/nonsense)" = 404
          docker compose -f deploy/docker-compose.yml down -v
