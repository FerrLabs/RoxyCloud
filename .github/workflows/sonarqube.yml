name: SonarQube

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  version:
    name: Resolve latest release tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - id: tag
        run: |
          TAG=$(git tag -l 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n1)
          VERSION="${TAG#v}"
          echo "version=${VERSION:-0.0.0}" >> "$GITHUB_OUTPUT"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: roxy
          POSTGRES_PASSWORD: roxy
          POSTGRES_DB: roxycloud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U roxy"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-tarpaulin
      # roxycloud-app is excluded: it has no tests, and building it would need
      # both the webview toolchain and a built web/dist for generate_context!.
      - run: cargo tarpaulin --workspace --exclude roxycloud-app --out xml --skip-clean
        env:
          DATABASE_URL: postgres://roxy:roxy@localhost:5432/roxycloud
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-cobertura
          path: cobertura.xml
          retention-days: 1

  scan:
    needs: [version, coverage]
    # reusable-sonarqube-scan declares `pull-requests: write` to post the diff
    # on a pull request. A called workflow cannot get more than its caller
    # grants, and permissions are checked before any job runs.
    permissions:
      contents: read
      pull-requests: write
    uses: FerrLabs/.github/.github/workflows/reusable-sonarqube-scan.yml@15286b37e14c898251a98ea18d21b69ab0bf777f # main
    with:
      runner: ubuntu-latest
      project-key: RoxyCloud
      coverage-artifact: coverage-cobertura
      args: >-
        -Dsonar.projectVersion=${{ needs.version.outputs.version }}
        -Dsonar.rust.cobertura.reportPaths=.sonarcov/cobertura.xml
    secrets: inherit
